# GTA VR camera hook config for GTA V Legacy / Standard
# Prepared for the original DX11 game branch.

[Camera]
module=GTA5.exe

# GTA V Original / Legacy pattern
# Based on the old GTAForums camera matrix pattern.
pattern=48 8B C7 F3 0F 10 0D
patternOffset=-0x1D
relativeOffsets=0,3
# The GTAForums Legacy pattern resolves a pointer slot first; dereference it
# once to reach the gameplay camera object, then apply matrixOffset.
pointerOffsets=0
matrixOffset=0x1F0

# Axis adjustments
negateRight=0
negateForward=0
negateUp=0
