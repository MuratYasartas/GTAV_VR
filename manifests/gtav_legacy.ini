# ============================================================================
# GTA V build manifest - version-pinned signatures (AOB patterns + offsets)
# ----------------------------------------------------------------------------
# Consumed by OVRInject/Game/BuildManifest.cpp. NO AOB pattern or offset may
# live in source code; every value the camera/FOV resolvers need comes from a
# build section below. If the running build matches no section, the mod logs a
# diagnostic and the resolvers fail cleanly (no hardcoded fallback).
#
# Detection ([detect]):
#   - GTA5.exe FileVersion via GetFileVersionInfo -> "1.0.<build>.<qfe>"
#   - a section [bNNNN] matches when NNNN == <build>
#   - a section may instead pin an exact version=1.0.x.y string, or match on
#     matchModule=<exe name> (used for GTA5_Enhanced.exe).
#   - module size (SizeOfImage) is logged with the diagnostic to help add
#     future sections.
#
# Value keys per build section:
#   cameraPattern / cameraPattern.N   - IDA-style AOB ("48 8B ?? ...")
#   cameraPatternOffset(.N)           - applied to the match address first
#   relativeOffsets(.N)               - chained RIP-relative disp32 resolves
#   ripOffset(.N)                     - single RIP disp32 offset (0 = disabled)
#   pointerOffsets(.N)                - pointer chain after RIP resolve
#   matrixOffset(.N)                  - resolved base -> camera matrix offset
#   source(.N)                        - attribution (keep honest!)
#   fovPattern(.N) / fovPatterns      - camera-director AOB for GtaCameraFov
#   fovCallOffset(.N)                 - E8 relative call offset (-1 = n/a)
#   fovGlobalPtrOffset(.N)            - RIP-relative global ptr offset (-1 = n/a)
#   fovSource(.N)                     - attribution
#   verified=0|1                      - 0 while ANY value below is UNVERIFIED
#
# UNVERIFIED means: taken from source comments / prior-art analysis, NOT yet
# confirmed against the named live build. Treat with caution.
# ============================================================================

[detect]
module=GTA5.exe
# Full-process camera-metadata sweep minimum interval (seconds).
# Read by BuildManifest::GetMetadataSweepIntervalSeconds; default 5.
metadataSweepIntervalSec=5

