# ============================================================================
# HUD shader-hash registry (Phase 6 HUD infrastructure)
# ----------------------------------------------------------------------------
# Consumed by OVRInject/D3DHook/HudRedirect.hpp. enabled=1 installs shader
# identification hooks (CreateVertexShader/CreateGeometryShader/
# CreatePixelShader) and the offscreen HUD render-target redirect + composite.
# Default 0: fully inert - no hooks are installed.
#
# Hash format: "<fnv1a64-hex>-<stage>" where the hash is FNV-1a-64 over the
# raw DXBC bytecode exactly as passed to Create*Shader (3Dmigoto-style names;
# algorithm parity UNVERIFIED - see docs/known-issues.md).
#
# verified=0: the four seeded hashes below come from LukeRoss R.E.A.L. r7
# analysis of an OLD build; they are NOT expected to match current builds and
# must be re-derived against the live build before enabling.
# ============================================================================
