# --- Primary: GTA V Original/Legacy camera matrix pattern ------------------
# Source: old GTAForums camera-matrix thread
#   https://gtaforums.com/topic/888560-c-source-camera-matrix-right-forward-up-position/
#   (via repo root gtavr_camera.ini + gtavr_camera_legacy.ini)
# UNVERIFIED against b3095.
