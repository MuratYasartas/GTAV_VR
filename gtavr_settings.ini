# GTA VR Settings
# Auto-generated - edit with care

[World]
worldScale=1.1
playerHeight=1.7
cameraOffsetX=-0.07
cameraOffsetY=0.02
cameraOffsetZ=-0.06

imageOffsetX=0
imageOffsetY=0
imageScale=1

[CameraFov]
fovOverride=0
fovPerType=0
fovGlobal=55
fovFpPed=55
fovTpPed=55
fovTpAim=55
fovFpVehicle=55
fovTpVehicle=55
fovOffsetOverride=0
fovManualOffset=48

[Stereo]
# stereoMode: 0=Reprojection (Z3D depth displace), 1=AlternateEye (AER, default).
# 2=DualPass is EXPERIMENTAL: not functional, StereoEngine logs once and falls back to AER.
stereoMode=1
# stereoIPD is a FALLBACK only: at runtime the HMD-reported eye offset overrides it.
stereoIPD=0.0595
headTracking=1
positionTracking=1

[Comfort]
# Snap turn ON by default (docs/user/comfort.md safety default).
# snapTurning=0 selects smooth turning at smoothTurnSpeed deg/s instead.
snapTurning=1
snapTurnAngle=45
# Locomotion vignette ON by default: fades in with movement (head-motion and
# left-stick proxy, stronger while driving), off while stationary.
vignetteEnabled=1
vignetteIntensity=0.5
# Vehicle horizon lock ON by default: vehicle pitch/roll no longer rotates the
# VR view (yaw passes through). Requires decoupling (default on).
vehicleHorizonLock=1
# Smooth-turn speed in deg/s, used only when snapTurning=0.
smoothTurnSpeed=120

[Performance]
# Force the desktop mirror Present sync interval to 0 (legacy behavior).
# Default 0 = preserve the game's own sync interval.
desktopMirrorSyncOverride=0
asyncReprojection=1
renderScale=1

gameResolutionScale=1.03

reprojectionEnabled=1
reprojectionIPD=0.038
reprojectionDepthScale=0.048
reprojectionDepthBias=-0.22
reprojectionInvertDepth=0

[Controls]
swapHands=0
triggerThreshold=0.5
gripThreshold=0.5
headLookEnabled=0
headLookMaxAngle=60
headLookDeadzone=0.6
headLookSensitivity=1200
headLookInvertY=1

[Overlay]
overlayDistance=1.1
overlayScale=0.7
overlayOpacity=1

[Decoupling]
decouplingEnabled=1
decouplingMode=0
decouplingMaxPitch=53
decouplingMaxYaw=180
decouplingAimCone=30

[Cutscene]
# cutsceneMode: 0=Normal (VR tracking), 1=VirtualScreen (theater, safety
# default - forced camera motion is a P0 nausea trigger), 2=Unlock.
cutsceneMode=1
cutsceneScreenDistance=3.9
cutsceneScreenScale=2.9
cutsceneScreenCurve=0.3

[Debug]
showDebugInfo=1
showControllerModels=1
