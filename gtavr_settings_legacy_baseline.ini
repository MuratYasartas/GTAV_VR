# GTA VR Settings - Legacy baseline
# Use this to validate camera hook and head tracking before enabling
# more aggressive comfort/decoupling tweaks.

[World]
worldScale=1.0
playerHeight=1.7
cameraOffsetX=0.0
cameraOffsetY=0.02
cameraOffsetZ=0.0

imageOffsetX=0.0
imageOffsetY=0.0
imageScale=1.0

[CameraFov]
fovOverride=0
fovPerType=0
fovGlobal=55
fovFpPed=55
fovTpPed=55
fovTpAim=55
fovFpVehicle=55
fovTpVehicle=55
fovOffsetOverride=0
fovManualOffset=48

[Stereo]
stereoMode=1
stereoIPD=0.0617
headTracking=1
positionTracking=0

[Comfort]
snapTurning=0
snapTurnAngle=45
vignetteEnabled=0
vignetteIntensity=0.5

[Performance]
asyncReprojection=1
renderScale=1.0
gameResolutionScale=1.0
reprojectionEnabled=1
reprojectionIPD=0.022
reprojectionDepthScale=0.033
reprojectionDepthBias=-0.2
reprojectionInvertDepth=0

[Controls]
swapHands=0
triggerThreshold=0.5
gripThreshold=0.5
headLookEnabled=0
headLookMaxAngle=30
headLookDeadzone=2.0
headLookSensitivity=400
headLookInvertY=1

[Overlay]
overlayDistance=1.1
overlayScale=0.7
overlayOpacity=1.0

[Decoupling]
decouplingEnabled=0
decouplingMode=2
decouplingMaxPitch=85
decouplingMaxYaw=180
decouplingAimCone=30

[Cutscene]
cutsceneMode=1
cutsceneScreenDistance=4.0
cutsceneScreenScale=3.0
cutsceneScreenCurve=0.0

[Debug]
showDebugInfo=1
showControllerModels=1
