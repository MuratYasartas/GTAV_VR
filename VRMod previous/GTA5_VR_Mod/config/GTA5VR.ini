; GTA5 VR Mod Configuration
; Generated by GTA5VR

[General]
ModEnabled=true
GameVersion=auto
FirstRun=true

[VRRuntime]
; Options: auto, openxr, openvr
PreferredRuntime=auto
OpenXRRuntime=
; 0=auto, 1=oculus, 2=steamvr, 3=wmr
VRAPI=0

[Rendering]
; Options: native_stereo, synchronized_sequential, alternating_eye
RenderingMode=synchronized_sequential
ResolutionScale=100
EnableDepthBuffer=true
DepthFormat=D32_FLOAT
; Frame timing
TargetFramerate=90
AllowReprojection=true

[Display]
WorldScale=1.0
IPDOverride=0
; 0 = use HMD reported IPD
IPDValue=63.0
NearClip=0.1
FarClip=10000.0

[Comfort]
EnableSnapTurn=true
SnapTurnDegrees=45
EnableComfortVignette=true
VignetteIntensity=0.5
SeatedMode=false
StandingHeight=0

[HUD]
; Options: floating, head_locked, wrist, hidden
HUDMode=floating
HUDDistance=2.0
HUDScale=1.0
HUDOpacity=1.0
HUDCurvature=0.0
RadarScale=1.0
SubtitleSize=1.0

[Camera]
ForceFirstPerson=true
; Options: dashboard, hood, third_person
VehicleCamera=dashboard
; Options: vr_adapted, theater, original, skip
CutsceneMode=vr_adapted
EnablePositionalTracking=true
PositionalScale=1.0
; Options: head_shake, button, both
RecenterMethod=head_shake
RecenterButton=7B

[Input]
; Options: gamepad, motion_controllers, hybrid
InputMode=gamepad
SwapSticks=false
EnableHaptics=true
HapticIntensity=0.7

[Performance]
ShowPerformanceOverlay=false
ShowReprojectionIndicator=false
LimitFramerate=false
FramerateLimit=90

[Debug]
EnableDebugMode=false
; Options: minimal, verbose, debug
LogLevel=verbose
LogToFile=true
LogFilePath=GTA5VR.log
ShowDebugOverlay=false

[Advanced]
; These settings are for advanced users
DisablePostProcessing=false
DisableDOF=true
DisableMotionBlur=true
DisableBloom=false
UseAsyncCompute=true
PreferDedicatedGPU=true
