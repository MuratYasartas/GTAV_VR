# GTA VR camera hook config
# This file configures how the VR mod finds and hooks the camera matrix.
#
# Multiple patterns are tried in order. Select the one for your GTA V version
# by commenting out the others with #.

[Camera]
module=GTA5.exe
# Camera resolution bounds (GtaCameraHook background worker):
# resolveTimeoutSec     - wall-clock budget for full resolution passes (default 30)
# backgroundRetrySec    - interval for cheap background retries after give-up (default 60)
#resolveTimeoutSec=30
#backgroundRetrySec=60
# ripOffset: byte offset of a RIP-relative disp32 inside the matched pattern.
# Set to 0 to disable RIP resolution and use the pattern address directly.

# ============================================================================
# GTA V Enhanced Edition (2025) - Primary pattern from LukeRoss R.E.A.L. VR
# This is the main camera reading pattern for GTA V Enhanced
# ============================================================================
pattern=48 8B 41 10 F3 0F 10 00 F3 0F 10 48 08
patternOffset=0
ripOffset=0
pointerOffsets=0x10
matrixOffset=0x1F0

# ============================================================================
# GTA V Enhanced - Alternative: Third person camera pitch pattern
# Uncomment if the above doesn't work
# ============================================================================
# pattern=48 8D 8E C8 02 00 00 48 8B 96 C0 02 00 00
# patternOffset=0
# ripOffset=3
# pointerOffsets=0
# matrixOffset=0x2C8

# ============================================================================
# GTA V Enhanced - Alternative: Free pitch control pattern
# ============================================================================
# pattern=F3 0F 5D CF 0F 28 F7 F3 0F C2 F2 01 0F 28 DE
# patternOffset=0
# ripOffset=0
# pointerOffsets=0
# matrixOffset=0x1F0

# ============================================================================
# GTA V Original (2017 builds) - Old GTAForums pattern
# https://gtaforums.com/topic/888560-c-source-camera-matrix-right-forward-up-position/
# Only use this for older GTA V versions (pre-Enhanced)
# ============================================================================
# pattern=48 8B C7 F3 0F 10 0D
# patternOffset=-0x1D
# relativeOffsets=0,3
# pointerOffsets=0
# matrixOffset=0x1F0

# ============================================================================
# Axis adjustments (usually not needed, but try if camera is inverted)
# ============================================================================
negateRight=0
negateForward=0
negateUp=0
